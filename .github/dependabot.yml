# Dependabot — copy into each application repository as `.github/dependabot.yml`
# This file also keeps the org `.github` repo itself patched.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

