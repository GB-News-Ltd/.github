# App-repo Dependabot starter — save as `.github/dependabot.yml`
# Opens PRs into `dev` so dependency bumps follow feature → dev → staging → master.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    labels: [dependencies, github-actions]
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    labels: [dependencies, javascript]
    commit-message:
      prefix: chore
      include: scope
    groups:
      production-minor:
        dependency-type: production
        update-types: [minor, patch]
      dev-minor:
        dependency-type: development
        update-types: [minor, patch]
