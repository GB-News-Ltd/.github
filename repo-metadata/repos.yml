version: 1
repos:
  - name: .github
    description: Org defaults, reusable workflows, handbook, and templates
    domain: platform
    criticality: high
    default_branch: main
    long_lived_branches: [main]
    owners:
      github_team: GB-News-Ltd/platform-engineering
      escalate: GB-News-Ltd/security
    contacts:
      oncall: null
      slack: "#eng-platform"
    jira:
      project: null
    languages:
      - yaml
      - markdown
    lifecycle: active
    notes: Meta-repo; product repos use master/staging/dev per branching handbook.

  - name: app-iOS
    description: GB News iOS app (Tuist / TCA)
    domain: ios
    criticality: critical
    default_branch: master
    long_lived_branches: [master, staging, dev]
    owners:
      github_team: apexapambhar
      escalate: GB-News-Ltd/qa-leads
    contacts:
      oncall: null
      slack: "#eng-ios"
    jira:
      project: GNA
    languages:
      - swift
    lifecycle: active
    notes: Lead @apexapambhar. Squash-only; merge-source guard required on master/staging/dev.

